name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release.mjs

  windows:
    name: Windows installer and portable app
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - run: npm run test:desktop
      - name: Launch packaged app
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/run-packaged-check.mjs "release/Tableloom-$version-win-x64-Portable.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release/Tableloom-*.exe | Sort-Object Name
          if ($files.Count -ne 2) { throw 'Expected an installer and a portable executable.' }
          $lines = $files | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: Tableloom-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Tableloom-*.exe
            release/SHA256SUMS.txt

  release:
    name: Publish GitHub release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tableloom-Windows-x64
          path: release
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/$version.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists. Create a new version to replace a published build.' >&2
            exit 1
          fi
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Tableloom $version" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Tableloom $version" --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
